name: ssh_depot
description: A minimal Flutter desktop tool for Linux operations over SSH.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  go_router: ^16.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  xterm: ^4.0.0
  yaml: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/svg/
    - assets/icons/png/
    - assets/images/png/
    - assets/images/jpg/
    - assets/terminal_themes/
